- html lang="en":
    - head:
        - meta charset="utf-8":
        - meta name="viewport" content="width=device-width, initial-scale=1.0":
        - title: ${title}
        - meta name="description" content="${description}":
        - meta property="og:title" content="${title}":
        - meta property="og:description" content="${description}":
        - meta property="og:site_name" content="${site.title}":
        - meta property="og:type" content="article":
        - meta property="og:url" content="${site.baseUrl}${page.url}":
        - meta property="og:article:published_time" content="${date}":
        - meta property="og:article:author" content="${author}":
        - script:
            - |
              window.rtglIcons = {};
        - link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.0.10/dist/themes/base.css":
        - link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.0.10/dist/themes/theme-rtgl-slate.css":
        - script src="https://cdn.jsdelivr.net/npm/construct-style-sheets-polyfill@3.1.0/dist/adoptedStyleSheets.min.js":
        - script src="https://cdn.jsdelivr.net/npm/@rettangoli/ui@1.0.10/dist/rettangoli-iife-ui.min.js":
        - link href="/public/theme.css" rel="stylesheet":

    - body.dark:
        - rtgl-view w="f" ah="c" bgc="bg" p="xl" id="top":
            - rtgl-view w="760" lg-w="680" md-w="f":
                - rtgl-text c="fg" s="sm":
                    - a href="/blog/": Back
                - rtgl-text c="fg" s="h1" mt="xl": ${title}
                - rtgl-text c="mu" s="sm" mb="xl": ${formatDate(date, "MMM D, YYYY")}
                - rtgl-view class="article-content":
                    - "${content}"
                - rtgl-text c="fg" s="md" mt="xl":
                    - a href="#top": Back to top
                - rtgl-view h="50vh":
